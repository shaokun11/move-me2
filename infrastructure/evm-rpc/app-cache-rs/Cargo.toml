[package]
name = "app-cache"
version = "0.1.0"
edition = "2018"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.7.7"
rs-leveldb = "0.1.5"
tokio = {version = "1.41.1", features = ["full"]}
serde = {version = "1.0.215", features = ["derive"]}
serde_json = "1.0.132"
anyhow = "1.0.93"
tower = { version = "0.5.1", features = ["full"] }

[[bin]]
name = "app-cache"
path = "main.rs"
[workspace]
